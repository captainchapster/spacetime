# Build the site and publish it to GitHub Pages on every push to main:
# https://captainchapster.github.io/spacetime/ (flight: …/flight.html).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The real sky (NASA's Milky Way map and the Hipparcos star catalogue) isn't stored in
      # the repo: it's downloaded and built once, then cached until the build script changes.
      - name: Restore the real sky
        id: sky
        uses: actions/cache@v4
        with:
          path: app/public/sky
          key: sky-${{ hashFiles('app/scripts/build-sky.mjs') }}

      - name: Build the real sky
        if: steps.sky.outputs.cache-hit != 'true'
        run: npm run fetch-sky

      - run: npm test

      - name: Build the site
        run: npm run build
        env:
          BASE_PATH: /spacetime/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
